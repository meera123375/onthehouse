<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OTH Cashier</title><style>
:root{--c:#f5eadb;--p:#fffaf1;--b:#7a3341;--d:#2d2119;--g:#e1b44f}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--d);font-family:Arial;background-image:radial-gradient(#7a334115 2px,transparent 2px);background-size:24px 24px}header{padding:15px 22px;background:var(--p);border-bottom:3px solid var(--d);display:flex;justify-content:space-between}.logo{font-size:27px;font-weight:1000;color:var(--b)}main{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;padding:16px}.panel{background:var(--p);border:3px solid var(--d);border-radius:22px;padding:18px;box-shadow:6px 6px 0 var(--d)}h2{color:var(--b);margin:0 0 14px}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}button{border:3px solid var(--d);border-radius:14px;background:white;padding:12px;font-weight:900;cursor:pointer;box-shadow:3px 3px 0 var(--d)}.drink{display:flex;justify-content:space-between;text-align:left}.drink.sel,.top.sel{background:var(--b);color:white}.tops{display:flex;gap:7px;flex-wrap:wrap}.top{font-size:11px;padding:8px}.cartItem{padding:10px 0;border-bottom:2px dashed #d6c4b2;display:flex;justify-content:space-between}.cartItem small{display:block;color:#786b61}.total{font-size:31px;font-weight:1000;color:var(--b);display:flex;justify-content:space-between;margin:15px 0}.complete{width:100%;background:var(--b);color:white;font-size:17px;border-radius:999px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:15px}.stat{border:2px solid var(--d);border-radius:13px;padding:9px;text-align:center;background:#f3dfc9;font-size:10px;font-weight:900}.stat b{display:block;font-size:23px;color:var(--b)}.orders{max-height:260px;overflow:auto;margin-top:12px}.order{display:grid;grid-template-columns:55px 1fr auto;gap:7px;align-items:center;padding:9px;border-bottom:1px solid #d8c7b7}.winner{background:#f7e6ae}.num{font-weight:1000;color:var(--b)}.status{font:900 9px monospace}.receipt{display:none;text-align:center;background:#f7e6ae;border:3px solid var(--d);border-radius:16px;padding:13px;margin-top:12px}.receipt b{font-size:34px;color:var(--b)}@media(max-width:800px){main{grid-template-columns:1fr}}
</style></head><body><header><div class="logo">ON THE HOUSE · CASHIER</div><b>LIVE ARCADE ●</b></header><main><section class="panel"><h2>Choose drinks.</h2><div id="menu" class="menu"></div><div id="tb" style="display:none"><h4>AÇAÍ TOPPINGS</h4><div id="tops" class="tops"></div></div><button id="add" style="width:100%;margin-top:12px;background:var(--g)">+ ADD DRINK</button><div class="stats"><div class="stat"><b id="sold">0</b>DRINKS TODAY</div><div class="stat"><b id="wins">0</b>WINNERS</div><div class="stat"><b id="claimed">0</b>COOKIES CLAIMED</div></div><div id="orders" class="orders"></div></section><aside class="panel"><h2>Current order.</h2><div id="cart"></div><div class="total"><span>TOTAL</span><span id="total">AED 0</span></div><button id="complete" class="complete">COMPLETE ORDER →</button><button id="clear" style="border:0;box-shadow:none;background:transparent;color:var(--b)">Clear</button><div id="receipt" class="receipt">GIVE THEM THIS NUMBER<br><b id="newnum">#001</b><br><small>Enter it at the House Arcade.</small></div></aside></main><script>
const DB="https://on-the-house-f4d6d-default-rtdb.europe-west1.firebasedatabase.app";const drinks=[["Basic Tea · Hot",34],["Basic Tea · Iced",34],["Oat Vanilla Matcha",35],["Salted Vanilla Matcha",35],["Açaí",40],["Dirty Espresso",32],["Spanish Latte",34],["Cappuccino",30],["Cortado",30]],toppings=["Peanut Butter","Nutella","Strawberries","Blueberries"];let selected=null,st=[],cart=[];const $=x=>document.getElementById(x);async function get(p){let r=await fetch(`${DB}/${p}.json?x=${Date.now()}`,{cache:"no-store"});return r.json()}async function put(p,v){let r=await fetch(`${DB}/${p}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(v)});if(!r.ok)throw 0}
function menu(){ $("menu").innerHTML=drinks.map((d,i)=>`<button class="drink ${selected===i?"sel":""}" onclick="pick(${i})"><span>${d[0]}</span><span>${d[1]}</span></button>`).join("");$("tops").innerHTML=toppings.map(t=>`<button class="top ${st.includes(t)?"sel":""}" onclick="topx('${t}')">${t}</button>`).join("")}window.pick=i=>{selected=i;if(drinks[i][0]==="Açaí")$("tb").style.display="block";else{$("tb").style.display="none";st=[]}menu()};window.topx=t=>{st=st.includes(t)?st.filter(x=>x!==t):[...st,t];menu()};$("add").onclick=()=>{if(selected===null)return;let d=drinks[selected];cart.push({name:d[0],price:d[1],toppings:d[0]==="Açaí"?[...st]:[]});selected=null;st=[];$("tb").style.display="none";menu();cartx()};function cartx(){$("cart").innerHTML=cart.length?cart.map((x,i)=>`<div class="cartItem"><div><b>${x.name}</b>${x.toppings.length?`<small>${x.toppings.join(" · ")}</small>`:""}</div><div>AED ${x.price} <button style="border:0;box-shadow:none;padding:3px" onclick="rm(${i})">×</button></div></div>`).join(""):"<p style='color:#88786d'>Choose drinks on the left.</p>";$("total").textContent="AED "+cart.reduce((a,x)=>a+x.price,0)}window.rm=i=>{cart.splice(i,1);cartx()};$("clear").onclick=()=>{cart=[];cartx();$("receipt").style.display="none"};let localNext=parseInt(localStorage.getItem("othNextOrder")||"1",10);
async function syncNext(){
 try{
   let remote=await get("final/meta/nextOrder");
   if(remote && remote>localNext){localNext=remote;localStorage.setItem("othNextOrder",String(localNext))}
 }catch(e){}
}
syncNext();

$("complete").onclick=()=>{
 if(!cart.length)return;
 const n=String(localNext).padStart(3,"0");
 const snapshot=cart.map(x=>({name:x.name,price:x.price,toppings:[...(x.toppings||[])]}));
 const order={number:n,items:snapshot,total:snapshot.reduce((a,x)=>a+x.price,0),drinkCount:snapshot.length,status:"active",won:false,cookie:null,created:Date.now()};
 localNext++;localStorage.setItem("othNextOrder",String(localNext));

 // Show the customer's number IMMEDIATELY — no waiting for Firebase.
 $("newnum").textContent="#"+n;
 $("receipt").style.display="block";
 cart=[];cartx();

 // Save in the background. If Wi-Fi is slow, retry a few times.
 (async()=>{
   let saved=false;
   for(let attempt=0;attempt<4&&!saved;attempt++){
     try{
       await put("final/orders/"+n,order);
       await put("final/meta/nextOrder",localNext);
       saved=true;
     }catch(e){
       await new Promise(r=>setTimeout(r,700*(attempt+1)));
     }
   }
   if(!saved){
     $("receipt").innerHTML=`GIVE THEM THIS NUMBER<br><b>#${n}</b><br><small style="color:#7a3341">⚠ Not synced yet — check Wi-Fi before they play.</small>`;
   }else{
     $("receipt").innerHTML=`GIVE THEM THIS NUMBER<br><b>#${n}</b><br><small>Enter it at the House Arcade.</small>`;
     refresh();
   }
 })();
};
async function refresh(){try{let raw=await get("final/orders")||{},a=Object.values(raw).sort((x,y)=>(y.created||0)-(x.created||0));$("sold").textContent=a.reduce((n,o)=>n+(o.drinkCount||0),0);$("wins").textContent=a.filter(o=>o.won).length;$("claimed").textContent=a.filter(o=>o.cookieClaimed).length;$("orders").innerHTML=a.slice(0,30).map(o=>`<div class="order ${o.won?"winner":""}"><div class="num">#${o.number}</div><div><div class="status">${o.status==="active"?"WAITING":o.status==="playing"?"PLAYING · "+(o.game||""):o.won?"🍪 WON · "+(o.cookie||"COOKIE"):"FINISHED"}</div><small>${o.items.map(i=>i.name).join(", ")}</small></div><div>${o.won&&!o.cookieClaimed?`<button onclick="claim('${o.number}')">CLAIM</button>`:""}</div></div>`).join("")}catch(e){}}window.claim=async n=>{let o=await get("final/orders/"+n);o.cookieClaimed=true;o.status="claimed";await put("final/orders/"+n,o);refresh()};menu();cartx();refresh();setInterval(refresh,1500);
</script></body></html>
